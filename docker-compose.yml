services:
  server:
    build:
      context: https://github.com/kylepitcock/Sampler-game.git#${GIT_REF:-main}:server
      dockerfile: Dockerfile
    container_name: sampled-server
    ports:
      - "3001:3001"
    restart: unless-stopped

  client:
    build:
      context: https://github.com/kylepitcock/Sampler-game.git#${GIT_REF:-main}:client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: sampled-client
    depends_on:
      - server
    ports:
      - "5173:80"
    restart: unless-stopped
