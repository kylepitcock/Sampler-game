services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sampled-server
    ports:
      - "3001:3001"
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3001}
    container_name: sampled-client
    depends_on:
      - server
    ports:
      - "8080:80"
    restart: unless-stopped
